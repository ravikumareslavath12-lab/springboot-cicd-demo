
name: Spring Boot CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configure Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Build Spring Boot application
      - name: Build with Maven
        run: mvn -B clean package
          
          # 4. Configure SSH
               - name: Configure SSH
               env:
                 EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
                 EC2_HOST: ${{ secrets.EC2_HOST }}
               run: |
                 mkdir -p ~/.ssh
                 chmod 700 ~/.ssh
                 
                 if [ -z "$EC2_HOST" ]; then
                   echo "ERROR: EC2_HOST secret is empty"
                   exit 1
                 fi
                 
                 if [ -z "$EC2_SSH_KEY" ]; then
                   echo "ERROR: EC2_SSH_KEY secret is empty"
                   exit 1
                 fi
                 
                 printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
                 chmod 600 ~/.ssh/ec2_key
                 
                 echo "Checking SSH connectivity to EC2..."
                 
                 if ! ssh-keyscan -T 10 -p 22 -H "$EC2_HOST" > ~/.ssh/known_hosts; then
                   echo "ERROR: Cannot reach EC2 on port 22"
                   exit 1
                 fi
                 
                 echo "SSH configuration completed successfully"

      # 5. Copy JAR to EC2
      - name: Deploy JAR to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -e

          ssh -i "$HOME/.ssh/ec2_key" \
            -o IdentitiesOnly=yes \
            "$EC2_USERNAME@$EC2_HOST" \
            "mkdir -p /home/ubuntu/springboot-cicd-demo/target"

          scp -i "$HOME/.ssh/ec2_key" \
            -o IdentitiesOnly=yes \
            target/cicd-demo-0.0.1-SNAPSHOT.jar \
            "$EC2_USERNAME@$EC2_HOST:/home/ubuntu/springboot-cicd-demo/target/"

      # 6. Restart Spring Boot service
      - name: Restart Application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -e

          ssh -i "$HOME/.ssh/ec2_key" \
            -o IdentitiesOnly=yes \
            "$EC2_USERNAME@$EC2_HOST" \
            "sudo systemctl restart cicd-demo && \
             sudo systemctl is-active cicd-demo"
