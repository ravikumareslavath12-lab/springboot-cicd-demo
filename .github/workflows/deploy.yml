
name: Spring Boot CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configure Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Build Spring Boot application
      - name: Build with Maven
        run: mvn -B clean package

      # 4. Configure SSH
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        shell: bash
        run: |
          set -e

          echo "STEP 1: Creating SSH directory"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          echo "STEP 2: Validating secrets"
          test -n "$EC2_HOST"
          test -n "$EC2_SSH_KEY"

          echo "STEP 3: Writing SSH private key"
          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/ec2_key"
          chmod 600 "$HOME/.ssh/ec2_key"

          echo "STEP 4: Validating private key"
          ssh-keygen -y -f "$HOME/.ssh/ec2_key" > /dev/null

          echo "STEP 5: Testing EC2 port 22"
          if ! timeout 10 bash -c "echo > /dev/tcp/$EC2_HOST/22"; then
            echo "ERROR: EC2 SSH port 22 is unreachable"
            exit 1
          fi

          echo "STEP 6: Scanning EC2 host key"
          ssh-keyscan -T 10 -p 22 -H "$EC2_HOST" > "$HOME/.ssh/known_hosts"

          test -s "$HOME/.ssh/known_hosts"

          echo "SSH configuration completed successfully"

      # 5. Test SSH connection
      - name: Test SSH Connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -e

          ssh -i "$HOME/.ssh/ec2_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$EC2_USERNAME@$EC2_HOST" \
            "echo 'EC2 SSH Connection Successful'"

      # 6. Deploy JAR to EC2
      - name: Deploy JAR to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -e

          echo "Creating deployment directory"

          ssh -i "$HOME/.ssh/ec2_key" \
            -o IdentitiesOnly=yes \
            "$EC2_USERNAME@$EC2_HOST" \
            "mkdir -p /home/ubuntu/springboot-cicd-demo/target"

          echo "Copying JAR to EC2"

          scp -i "$HOME/.ssh/ec2_key" \
            -o IdentitiesOnly=yes \
            target/cicd-demo-0.0.1-SNAPSHOT.jar \
            "$EC2_USERNAME@$EC2_HOST:/home/ubuntu/springboot-cicd-demo/target/"

          echo "JAR deployment completed"

      # 7. Restart Spring Boot service
      - name: Restart Application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          set -e

          echo "Restarting Spring Boot application"

          ssh -i "$HOME/.ssh/ec2_key" \
            -o IdentitiesOnly=yes \
            "$EC2_USERNAME@$EC2_HOST" \
            "sudo systemctl restart cicd-demo && \
             sudo systemctl is-active cicd-demo"

          echo "Application deployment successful"
